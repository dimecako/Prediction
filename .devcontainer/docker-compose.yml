services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:1-10.0-noble
    volumes:
      - ..:/workspaces/Prediction:cached
    command: sleep infinity
    network_mode: service:db

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: prediction
      POSTGRES_USER: prediction_app
      POSTGRES_PASSWORD: prediction_dev
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres-data:
